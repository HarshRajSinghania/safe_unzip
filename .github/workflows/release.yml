name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing version tag to resume (for example, v0.2.0)
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RELEASE_REF: ${{ inputs.release_ref || github.ref_name }}

jobs:
  validate-release:
    name: Validate release metadata
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.resolve.outputs.release_sha }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate release tag
        id: resolve
        shell: bash
        run: |
          if ! grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$' <<<"${RELEASE_REF}"; then
            echo "Invalid release tag: ${RELEASE_REF}" >&2
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/${RELEASE_REF}"; then
            echo "Release tag does not exist: refs/tags/${RELEASE_REF}" >&2
            exit 1
          fi
          release_sha=$(git rev-parse "refs/tags/${RELEASE_REF}^{commit}")
          git checkout --detach "${release_sha}"
          ./scripts/check-release.sh "${RELEASE_REF}"
          echo "release_sha=${release_sha}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${RELEASE_REF}" >> "${GITHUB_OUTPUT}"

  # Publish to crates.io
  crates-io:
    name: Publish to crates.io
    needs: validate-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-release.outputs.release_sha }}
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Publish to crates.io
        if: github.event_name == 'push'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

  # Build Python wheels for all platforms
  build-wheels:
    name: Build wheel (${{ matrix.os }}, ${{ matrix.target }})
    needs: validate-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            manylinux: '2014'
          - os: ubuntu-24.04-arm
            target: aarch64
            manylinux: '2014'
          - os: macos-15-intel
            target: x86_64
            manylinux: auto
          - os: macos-latest
            target: aarch64
            manylinux: auto
          - os: windows-latest
            target: x64
            manylinux: auto
          - os: windows-11-arm
            target: aarch64
            manylinux: auto
    
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-release.outputs.release_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          rust-toolchain: '1.93'
          working-directory: python
          args: --release --strip --out dist
      
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}-${{ matrix.os }}
          path: python/dist/*.whl

  # Build source distribution
  build-sdist:
    name: Build source distribution
    needs: validate-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-release.outputs.release_sha }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install maturin
        run: pip install maturin
      
      - name: Build sdist
        run: |
          # Cargo adds the root license files to the sdist. Remove the Python
          # copies in this ephemeral checkout to avoid duplicate archive paths.
          rm python/LICENSE-MIT python/LICENSE-APACHE
          cd python && maturin sdist
      
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: target/wheels/*.tar.gz

  # Publish to PyPI
  pypi:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}

  # Create GitHub Release
  github-release:
    name: Create GitHub Release
    needs: [validate-release, crates-io, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-release.outputs.release_sha }}
      
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Download source distribution
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      
      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION=${{ needs.validate-release.outputs.release_tag }}
          VERSION=${VERSION#v}
          awk -v version="${VERSION}" '
            $0 == "## [" version "]" || index($0, "## [" version "] - ") == 1 {
              found = 1
              next
            }
            found && /^## \[/ { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release_notes.md
          test -s release_notes.md
          echo "Release notes:"
          cat release_notes.md
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate-release.outputs.release_tag }}
          files: |
            dist/*.whl
            dist/*.tar.gz
          body_path: release_notes.md
