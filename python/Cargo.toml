[package]
name = "safe_unzip_python"
version = "0.2.0"
edition = "2021"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tenuo-ai/safe_unzip"
authors = ["Niki A. <dev@tenuo.dev>"]
description = "Python bindings for secure ZIP, TAR, and 7z extraction"

[lib]
name = "safe_unzip"
crate-type = ["cdylib"]

[dependencies]
safe_unzip = { path = "..", features = ["tar", "sevenz"] }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py38"] }
flate2 = "1"  # For .tar.gz support
